version: "3.9"

services:
  neo4j:
    image: neo4j:5.15.0
    container_name: neo4j-db
    ports:
      - "7474:7474"  # Neo4j Browser
      - "7687:7687"  # Bolt protocol
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_PLUGINS=["apoc"]  #APOC plugin za napredne funkcije
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  route-service:
    build: ./route-optimizer
    container_name: route-service
    ports:
      - "8081:8081"  #za lokalno testiranje
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "80:80"
    depends_on:
      route-service:
        condition: service_healthy
    networks:
      - app-network

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:

networks:
  app-network:
    driver: bridge