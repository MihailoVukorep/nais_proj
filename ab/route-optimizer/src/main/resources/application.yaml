spring:
  application:
    name: route-optimizer
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}  # default je 'local'

---
# PROFILE: local - za lokalni razvoj
spring:
  config:
    activate:
      on-profile: local
  
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: password

server:
  port: 8081

logging:
  level:
    org.springframework.data.neo4j: DEBUG
    org.neo4j.driver: INFO
    com.example.demo: DEBUG

---
# PROFILE: docker - za Docker okruženje
spring:
  config:
    activate:
      on-profile: docker
  
  neo4j:
    uri: bolt://neo4j:7687
    authentication:
      username: neo4j
      password: password

server:
  address: 0.0.0.0
  port: 8081